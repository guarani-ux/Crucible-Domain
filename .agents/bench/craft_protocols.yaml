version: 1.0.1
surface_cleanliness:
  forbid_in_stakeholder_body:
  - '#L'
  - .agents/
  - BENCH_CANDIDATE
  custody_appendix_heading: '## Internal Custody & Sources'
platform_physics:
  youtube:
    hook_window_s: 5
    muted_first: false
    retention_reset_max_s: 90
    aspect_ratio: '16:9'
    physics_rule: Confirm title/thumbnail promise within 5s, reset curiosity every
      60-90s, and deliver full watch-session payoff with direct description CTA.
  instagram:
    hook_window_s: 2
    muted_first: true
    retention_reset_max_s: 15
    aspect_ratio: '9:16'
    physics_rule: Visual pattern interrupt in 0-2s; 100% comprehensible on mute via
      kinetic captions; concise save/share CTA.
  linkedin:
    hook_window_s: 4
    muted_first: true
    retention_reset_max_s: 30
    aspect_ratio: 4:5 or 16:9
    physics_rule: Open with a sharp civic/professional insight or counterintuitive
      proof; scannable captions; peer-credible institutional tone.
  facebook:
    hook_window_s: 3
    muted_first: true
    retention_reset_max_s: 30
    aspect_ratio: 4:5 or 16:9
    physics_rule: Immediate neighborhood utility and local belonging; warm community
      invitation; clear shareable branch/card action.
  live_broadcast:
    hook_window_s: 5
    muted_first: false
    retention_reset_max_s: 45
    aspect_ratio: '16:9'
    physics_rule: Breath-length spoken sentences (<=14 words average), one idea per
      breath, zero tongue-twisters, natural teleprompter-free cadence.
av_length_architectures:
  15:
    label: 15s Vertical / Cutdown
    min_beats: 2
    max_wpm: 145
    require_abc_tracks: false
    require_but_therefore: false
    max_beat_s: 8
  30:
    label: 30s Spot / Short
    min_beats: 3
    max_wpm: 150
    require_abc_tracks: false
    require_but_therefore: true
    max_beat_s: 15
  45:
    label: 45s Live Host / LinkedIn
    min_beats: 3
    max_wpm: 145
    require_abc_tracks: false
    require_but_therefore: true
    max_beat_s: 20
  60:
    label: 1-Minute Walkthrough / Diagnostic
    min_beats: 4
    max_wpm: 150
    require_abc_tracks: true
    require_but_therefore: true
    max_beat_s: 25
  180:
    label: 3-Minute Mini-Documentary
    min_beats: 5
    max_wpm: 150
    require_abc_tracks: true
    require_but_therefore: true
    max_beat_s: 60
  300:
    label: 5-Minute Deep-Dive Episode
    min_beats: 6
    max_wpm: 150
    require_abc_tracks: true
    require_but_therefore: true
    max_beat_s: 75
form_protocols:
  av_script:
    required_graph_nodes:
    - reality_and_custody
    - belief_delta_matrix
    - causal_spine
    craft_principles:
    - 'Visual-First Subtraction: design physical camera action BEFORE writing spoken
      words; never let Audio describe what Video already shows (overlap <=0.35).'
    - 'But/Therefore Causality: connect beats via complication (''BUT'') and consequence
      (''THEREFORE''), never flat ''and then'' facility tours.'
    - 'A/B/C Story Convergence (60s+): weave A-story (external patron task), B-story
      (human emotional shift), and C-story (library public-value truth).'
    - 'Spoken-Ear Prosody: active verbs, concrete nouns, natural breath pauses, <=150
      WPM.'
    - 'Clean Stakeholder Surface: keep raw repo line numbers and unexplained internal
      codes out of spoken/viewer copy; place provenance in Internal Custody & Sources.'
    evolved_upgrades:
    - Require an unresolved visual/curiosity hook gap in Beat 1 and explicit BUT/THEREFORE
      causal beat links with retention resets <=60s on long-form scripts.
  production_brief:
    required_graph_nodes:
    - reality_and_custody
    - belief_delta_matrix
    - causal_spine
    craft_principles:
    - 'Minto Pyramid (SCQA): lead with Decision Request + Opportunity Cost vs doing
      nothing in the top 25%.'
    - Every unknown or clearance hold MUST have an explicit named accountable owner.
    - Keep executive body clean of raw internal paths (#L12); isolate citations in
      Internal Custody & Sources.
    evolved_upgrades: []
  leadership_report:
    required_graph_nodes:
    - reality_and_custody
    - belief_delta_matrix
    - causal_spine
    craft_principles:
    - 'CEO Altitude: lead with the Decision Request in the top 25%, frame strategic upside, counterargument steelman, resource commitment, and patron service promise cleanly.'
    - 'Owned Holds: every unresolved dependency, clearance, or budget unknown MUST carry a named accountable owner.'
    - Never cite 2023-2026 plan as active or misuse Vision 2040 as a single-video KPI.
    evolved_upgrades: []
  research_note:
    required_graph_nodes:
    - reality_and_custody
    - belief_delta_matrix
    - causal_spine
    craft_principles:
    - 'Signal Before Hypothesis: present observed evidence and verified local citations BEFORE stating hypotheses or proposed bets.'
    - 'Falsifiability & Transfer Limits: explicitly state what does NOT transfer, boundary conditions, and the exact next test / baseline metric.'
    - Keep stakeholder body free of raw internal paths; place source references in Internal Custody & Sources.
    evolved_upgrades: []
  treatment:
    required_graph_nodes:
    - reality_and_custody
    - belief_delta_matrix
    - causal_spine
    craft_principles:
    - 'Premise First: state the core premise, hook, and logline in the top 35% of the document.'
    - 'Visual & Narrative Arc: define the concrete visual approach, sound world, and act-by-act emotional/causal arc.'
    - 'Intent vs Availability Separation: explicitly mark pending location, talent, or clearance holds with named owners.'
    evolved_upgrades: []
  call_sheet:
    required_graph_nodes:
    - reality_and_custody
    - belief_delta_matrix
    - causal_spine
    craft_principles:
    - 'Cold-Receiver Shootability: include a structured operational table (>=2 rows) with call time/date, exact location/branch, crew/cast roles, and safety/equipment notes.'
    - 'Zero Unverified Assumptions: mark unconfirmed talent, branch permissions, or gear holds explicitly with named owners.'
    - 'Single-Location Realism: match crew size and schedule to actual branch hours and access constraints.'
    evolved_upgrades: []
  shot_list:
    required_graph_nodes:
    - reality_and_custody
    - belief_delta_matrix
    - causal_spine
    craft_principles:
    - 'Standard Framing & Coverage: include a structured shot table (>=3 rows) using standard framing codes (WS, MS, MCU, CU, ECU, OTS, B-Roll), movement, audio/nat-sound cue, and purpose.'
    - 'Visual-First Coverage: every shot must advance the causal spine or prove a service truth without redundant coverage.'
    - 'Location & Gear Custody: note practical lighting, audio, and lab safety constraints per setup.'
    evolved_upgrades: []
  content_calendar:
    required_graph_nodes:
    - reality_and_custody
    - belief_delta_matrix
    - causal_spine
    craft_principles:
    - 'Cross-Platform Divergence: include a structured schedule table (>=3 rows) across distinct platforms (YouTube, Instagram, LinkedIn, Facebook) with platform-native hooks, formats, publish windows, and CTAs.'
    - 'Zero Copy-Paste Recycling: each platform entry must adapt angle, length, and tone to its native audience physics.'
    - 'Governance Holds: mark unapproved release dates or G06 sign-off gates explicitly with named owners.'
    evolved_upgrades: []
