# Canonical 5-Tier Vertical Ontology: L0 (Root) -> L1 (3 Axes) -> L2 (5 Engines) -> L3 (12 Sub-Disciplines) -> L4 (36 Atomic Primitives)
# Zero orphans, zero dangling edges; verified mechanically by `crucible_gate.py bench test-validity`.
version: "1.0"

L0_root:
  id: L0:INSTITUTIONAL_SENSEMAKING_AND_ACTION_DESIGN
  title: Institutional Sensemaking & Action Design
  definition: "Converting verified reality into a medium-native artifact that moves specific human stakeholders—under finite resources and institutional legitimacy—from their current mental state to a concrete decision or action."
  governs_l1:
    - L1:AXIS_1_INTEGRITY
    - L1:AXIS_2_RHETORICAL_FORCE
    - L1:AXIS_3_EXECUTABILITY

L1_axes:
  - id: L1:AXIS_1_INTEGRITY
    parent_l0: L0:INSTITUTIONAL_SENSEMAKING_AND_ACTION_DESIGN
    title: "Axis I — Epistemic & Strategic Integrity"
    core_question: "Is it true, legitimate, and worth doing over alternatives?"
    governs_l2:
      - L2:ENG_1_EPISTEMOLOGY_TRANSDUCTION
      - L2:ENG_2_INSTITUTIONAL_LEGITIMACY

  - id: L1:AXIS_2_RHETORICAL_FORCE
    parent_l0: L0:INSTITUTIONAL_SENSEMAKING_AND_ACTION_DESIGN
    title: "Axis II — Cognitive & Rhetorical Force"
    core_question: "Does it actually move the target human mind in this medium?"
    governs_l2:
      - L2:ENG_3_ATTENTION_NARRATIVE
      - L2:ENG_4_RHETORIC_MEDIUM_PHYSICS

  - id: L1:AXIS_3_EXECUTABILITY
    parent_l0: L0:INSTITUTIONAL_SENSEMAKING_AND_ACTION_DESIGN
    title: "Axis III — Operational & Portfolio Executability"
    core_question: "Can real people actually produce, govern, and measure it under real constraints?"
    governs_l2:
      - L2:ENG_5_CONTENT_PLANNING_EXECUTION

L2_engines:
  - id: L2:ENG_1_EPISTEMOLOGY_TRANSDUCTION
    parent_l1: L1:AXIS_1_INTEGRITY
    title: "Problem-to-Vessel Transduction & Source Epistemology"
    governs_l3:
      - L3:SOURCE_PROVENANCE_AND_EVIDENCE
      - L3:PROBLEM_TO_VESSEL_TRANSDUCTION
      - L3:STRATEGIC_CHARTER_AND_TRADEOFFS

  - id: L2:ENG_2_INSTITUTIONAL_LEGITIMACY
    parent_l1: L1:AXIS_1_INTEGRITY
    title: "Equity, Reconciliation, Accessibility & Political Stewardship"
    governs_l3:
      - L3:EQUITY_RECONCILIATION_ACCESSIBILITY
      - L3:POLITICAL_STEWARDSHIP_AND_AUTHORITY

  - id: L2:ENG_3_ATTENTION_NARRATIVE
    parent_l1: L1:AXIS_2_RHETORICAL_FORCE
    title: "Attention, Tension & Narrative Architecture"
    governs_l3:
      - L3:HOOK_AND_TENSION_MECHANICS
      - L3:MULTI_TRACK_STORY_ARCHITECTURE
      - L3:PRIORITY_COMPRESSION_AND_SUBTRACTION

  - id: L2:ENG_4_RHETORIC_MEDIUM_PHYSICS
    parent_l1: L1:AXIS_2_RHETORICAL_FORCE
    title: "Rhetoric, Buy-In Psychology & Medium Physics"
    governs_l3:
      - L3:RHETORICAL_PERSUASION_AND_PSYCHOLOGY
      - L3:PLATFORM_AND_AV_MEDIUM_PHYSICS

  - id: L2:ENG_5_CONTENT_PLANNING_EXECUTION
    parent_l1: L1:AXIS_3_EXECUTABILITY
    title: "Content Planning, Portfolio Economics & Field Execution"
    governs_l3:
      - L3:PORTFOLIO_PLANNING_AND_ECONOMICS
      - L3:FIELD_FEASIBILITY_AND_CUSTODY

L3_sub_disciplines:
  - id: L3:SOURCE_PROVENANCE_AND_EVIDENCE
    parent_l2: L2:ENG_1_EPISTEMOLOGY_TRANSDUCTION
    definition: "Distinguishing verified primary records from secondary hearsay, inference, or unconfirmed assumptions."
  - id: L3:PROBLEM_TO_VESSEL_TRANSDUCTION
    parent_l2: L2:ENG_1_EPISTEMOLOGY_TRANSDUCTION
    definition: "Translating raw patron or organizational friction into the exact thesis, concept, or brief structure that solves it."
  - id: L3:STRATEGIC_CHARTER_AND_TRADEOFFS
    parent_l2: L2:ENG_1_EPISTEMOLOGY_TRANSDUCTION
    definition: "Grounding work in the active strategic plan, mission, vision, service promises, and explicit opportunity cost."
  - id: L3:EQUITY_RECONCILIATION_ACCESSIBILITY
    parent_l2: L2:ENG_2_INSTITUTIONAL_LEGITIMACY
    definition: "Upholding patron dignity, cultural permissions (HOLD-04), Intellectual Freedom, and plain-language/muted accessibility."
  - id: L3:POLITICAL_STEWARDSHIP_AND_AUTHORITY
    parent_l2: L2:ENG_2_INSTITUTIONAL_LEGITIMACY
    definition: "Respecting internal role boundaries (CD-01, G01-G06, Asana read-only) and protecting institutional reputation."
  - id: L3:HOOK_AND_TENSION_MECHANICS
    parent_l2: L2:ENG_3_ATTENTION_NARRATIVE
    definition: "Opening an unresolved cognitive/visual gap early and sustaining rising stakes across beats."
  - id: L3:MULTI_TRACK_STORY_ARCHITECTURE
    parent_l2: L2:ENG_3_ATTENTION_NARRATIVE
    definition: "Weaving A-story (external action), B-story (human shift), and C-story (institutional/service truth) into one payoff."
  - id: L3:PRIORITY_COMPRESSION_AND_SUBTRACTION
    parent_l2: L2:ENG_3_ATTENTION_NARRATIVE
    definition: "Ordering information by decision velocity and cutting zero-value prose, filler, and throat-clearing."
  - id: L3:RHETORICAL_PERSUASION_AND_PSYCHOLOGY
    parent_l2: L2:ENG_4_RHETORIC_MEDIUM_PHYSICS
    definition: "Balancing ethos, logos, pathos, authentic brand voice, and preemptive answers to stakeholder resistance."
  - id: L3:PLATFORM_AND_AV_MEDIUM_PHYSICS
    parent_l2: L2:ENG_4_RHETORIC_MEDIUM_PHYSICS
    definition: "Matching cognitive and physical medium constraints across YouTube, Instagram, LinkedIn, Facebook, and spoken A/V."
  - id: L3:PORTFOLIO_PLANNING_AND_ECONOMICS
    parent_l2: L2:ENG_5_CONTENT_PLANNING_EXECUTION
    definition: "Source-audited topic selection, capture-once adaptation economics, portfolio mix, and behavioral measurement beyond views."
  - id: L3:FIELD_FEASIBILITY_AND_CUSTODY
    parent_l2: L2:ENG_5_CONTENT_PLANNING_EXECUTION
    definition: "Physical clock/WPM/coverage feasibility, cold-receiver zero-email usability, named-owner holds, and CHG-01 recut custody."

L4_atomic_primitives:
  # Under L3:SOURCE_PROVENANCE_AND_EVIDENCE (3)
  - id: L4:PRIM_PRIMARY_SOURCE_CITATION
    parent_l3: L3:SOURCE_PROVENANCE_AND_EVIDENCE
    measurement_mode: both
    probe: source_and_charter_integrity
    forms: [production_brief, leadership_report, research_note, content_calendar]
  - id: L4:PRIM_OBSERVED_BEFORE_HYPOTHESIS
    parent_l3: L3:SOURCE_PROVENANCE_AND_EVIDENCE
    measurement_mode: gate1_deterministic
    probe: epistemic_order
