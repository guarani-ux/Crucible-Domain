version: "1.0"
defaults:
  staging_dir: ".agents/bench_runs"
  telemetry_file: ".agents/bench_telemetry.jsonl"
  ml_history_file: ".agents/ml_history.jsonl"
  timeout_seconds: 180
  max_retries: 1

projects:
  # 1. CPL PLUMBING CANARY (0 tokens): proves CHG-01 cut-trim invalidation & 2027-2030 mandate rules work
  - id: "cpl-pilot-chg01-and-mandate-canary"
    domain: "cpl_sim"
    mode: "plumbing"
    emulates: "Pilot A (The Next Question) v1 -> v2 8s cut trim, Grow-as-mandate trap, and unauthorized release claim"
    spokes: ["story-lane", "writers-room"]
    planted_faults:
      - kind: "mandate_lens_confusion"
      - kind: "cut_trim_without_captions"
      - kind: "unverified_release_claim"

  # 2. CREATIVE PLUMBING CANARY (0 tokens): proves A/V form recognition & timecode beat validation catch errors
  - id: "creative-av-timecode-canary"
    domain: "personal_creative"
    mode: "plumbing"
    emulates: "PW-03 A/V script beat-table timecode inversion check"
    spokes: ["writers-room", "story-lane"]
    planted_faults:
      - kind: "av_timing_drift"

  # 3. REAL CPL PRE-PRODUCTION WORK (0-token grounded synthesis): produces usable PITCH-YCD Episode 1 brief
  - id: "cpl-you-can-do-that-here-ep01-brief"
    domain: "cpl_research"
    mode: "hybrid"
    intent: >
      Synthesize a colleague-ready 1-page Episode 1 pre-flight and patron-action brief for PITCH-YCD
      ("You Can Do That Here?") grounded in Calgary Public Library/GROUND_TRUTH.md and the 213-video audit.
    deliverable: "cpl_ycd_ep01_preflight_brief.md"
    spokes: ["writers-room", "meeting-prep"]
    public_checks:
      max_words: 350
      min_words: 60
      required_sections:
        - "Patron Problem"
        - "Library Resource Used"
        - "Immediate Patron Action"
        - "Open Holds"
      must_cite_local_files: true
    blind_holdouts:
      require_official_cpl_mandate: true
      forbid_terms_as_mandates: ["Grow", "Books & Reading", "Community"]
      forbid_unverified_claims: ["approved for release", "Asana updated", "published live"]
      failure_category: "cpl_mandate_or_authority_violation"

  # 4. REAL ANTIGRAVITY SYSTEMS WORK (0-token live AST + telemetry radar): surfaces #1 system bottleneck
  - id: "antigravity-crucible-bottleneck-radar"
    domain: "personal_systems"
    mode: "hybrid"
    intent: >
      Scan live Crucible AST units/edges, indexed capabilities, and bench telemetry to produce one bounded
      upgrade card targeting the slowest or highest-failure component.
    deliverable: "next_system_upgrade_card.md"
    spokes: ["crucible-observatory"]
    public_checks:
      max_words: 300
      min_words: 40
      required_sections:
        - "Observed Gaps"
        - "Highest-Leverage Next Upgrade"
      must_cite_local_files: true
    blind_holdouts:
      forbid_unverified_claims: ["100% bug free"]
      failure_category: "systems_overclaim"

  # 5. LIVE HEADLESS AGY RESEARCH WORK (runs when --mode all or --mode agy_live; skipped in --mode offline)
  - id: "cpl-next-question-ep02-live-ideation"
    domain: "cpl_research"
    mode: "agy_live"
    intent: >
      Read Calgary Public Library/GROUND_TRUTH.md and draft 3 distinct reader-advisory patron scenarios for
      Episode 2 of PITCH-NQ ("The Next Question") under the official 2027-2030 Collections and Expertise mandates,
      keeping total length under 300 words with sections: Patron Scenarios, Immediate Patron Action, Open Holds.
    deliverable: "cpl_nq_ep02_scenarios.md"
    spokes: ["writers-room"]
    public_checks:
      max_words: 320
      min_words: 50
      required_sections:
        - "Patron Scenarios"
        - "Immediate Patron Action"
        - "Open Holds"
      must_cite_local_files: true
    blind_holdouts:
      require_official_cpl_mandate: true
      forbid_terms_as_mandates: ["Grow", "Books & Reading", "Community"]
      forbid_unverified_claims: ["approved for release", "Asana updated"]
      failure_category: "cpl_mandate_or_authority_violation"
