version: '1.0'
defaults:
  staging_dir: .agents/bench_runs
  telemetry_file: .agents/bench_telemetry.jsonl
  ml_history_file: .agents/ml_history.jsonl
  bandit_state_file: .agents/ml_bandit_state.json
  timeout_seconds: 180
  max_retries: 1
projects:
- id: cpl-pilot-chg01-and-mandate-canary
  domain: cpl_sim
  mode: plumbing
  emulates: Pilot A (The Next Question) v1 -> v2 8s cut trim, Grow-as-mandate trap, and unauthorized release claim
  spokes:
  - story-lane
  - writers-room
  planted_faults:
  - kind: mandate_lens_confusion
  - kind: cut_trim_without_captions
  - kind: unverified_release_claim
- id: creative-av-timecode-canary
  domain: personal_creative
  mode: plumbing
  emulates: PW-03 A/V script beat-table timecode inversion check
  spokes:
  - writers-room
  - story-lane
  planted_faults:
  - kind: av_timing_drift
- id: cpl-you-can-do-that-here-ep01-brief
  domain: cpl_research
  mode: hybrid
  form: production_brief
  target_audience: CPL Producer & Programme Owner
  intent: 'Synthesize a colleague-ready 1-page Episode 1 pre-flight and patron-action brief for PITCH-YCD ("You Can Do That Here?") grounded in Calgary Public Library/GROUND_TRUTH.md and the 213-video audit.

    '
  deliverable: cpl_ycd_ep01_preflight_brief.md
  spokes:
  - writers-room
  - meeting-prep
  public_checks:
    max_words: 350
    min_words: 60
    required_sections:
    - Patron Problem
    - Library Resource Used
    - Immediate Patron Action
    - Open Holds
    must_cite_local_files: true
  blind_holdouts:
    require_official_cpl_mandate: true
    forbid_terms_as_mandates:
    - Grow
    - Books & Reading
    - Community
    forbid_unverified_claims:
    - approved for release
    - Asana updated
    - published live
    failure_category: cpl_mandate_or_authority_violation
- id: antigravity-crucible-bottleneck-radar
  domain: personal_systems
  mode: hybrid
  form: research_note
  target_audience: Systems Architect (Levi)
  intent: 'Scan live Crucible AST units/edges, indexed capabilities, and bench telemetry to produce one bounded upgrade card targeting the slowest or highest-failure component.

    '
  deliverable: next_system_upgrade_card.md
  spokes:
  - crucible-observatory
  public_checks:
    max_words: 300
    min_words: 40
    required_sections:
    - Observed Gaps
    - Highest-Leverage Next Upgrade
    must_cite_local_files: true
  blind_holdouts:
    forbid_unverified_claims:
    - 100% bug free
    failure_category: systems_overclaim
- id: cpl-next-question-ep02-research
  domain: cpl_research
  mode: agy_live
  form: research_note
  target_audience: CPL Strategist & Series Producer
  intent: 'Read Calgary Public Library/GROUND_TRUTH.md and draft a research_note for PITCH-NQ Episode 2 identifying 3 concrete reader-advisory patron barriers under the official 2027-2030 Collections and Expertise mandates, separating observed evidence from hypotheses, listing transfer limits and a next test.

    '
  deliverable: cpl_nq_ep02_research.md
  spokes:
  - writers-room
  public_checks:
    max_words: 350
    min_words: 60
    required_sections:
    - Observed Signal
    - Hypothesis
    - Immediate Patron Action
    - Open Holds
    must_cite_local_files: true
    min_form_score: 0.6
  blind_holdouts:
    require_official_cpl_mandate: true
    forbid_terms_as_mandates:
    - Grow
    - Books & Reading
    - Community
    forbid_unverified_claims:
    - approved for release
    - Asana updated
    failure_category: cpl_mandate_or_authority_violation
  use_cases:
  - id: barrier-scan
    intent: Identify 3 reader-advisory patron barriers for PITCH-NQ Episode 2, separating observed evidence from hypotheses, with transfer limits and a next test.
    target_audience: CPL Strategist & Series Producer
    skills:
    - claim-evidence custody
    - audience research
    - hypothesis framing
    tools:
    - Calgary Public Library/GROUND_TRUTH.md
    - 213-video audit findings
  - id: peer-trend-scan
    intent: Scan what peer library YouTube channels do for reader advisory and propose one testable creative choice for PITCH-NQ, noting what would NOT transfer to CPL.
    target_audience: CPL Content Strategist
    skills:
    - trend scanning
    - transfer-limit analysis
    - decline-with-evidence
    tools:
    - Knowledge/Media Agency/Skills and Workflows/audience-and-campaigns.md (MK-03)
  - id: measurement-baseline
    intent: 'Propose how to measure whether Episode 2 changed patron behaviour beyond views: pick one indicator and a baseline, with owner holds for unknown data.'
    target_audience: Communications & Content Management
    skills:
    - measurement design
    - baseline setting
    - owner-hold separation
    tools:
    - Calgary Public Library/GROUND_TRUTH.md
- id: cpl-ycd-ep01-av-script
  domain: cpl_research
  mode: agy_live
  form: av_script
  target_audience: Director, Host, and Editor
  intent: 'Write a 30-second timed A/V script table (`MM:SS-MM:SS | Audio | Video`) for PITCH-YCD Episode 1 ("You Can Do That Here? — Free VHS Digitization") aligned with Experiences and Technology mandates. Keep spoken cadence <=150 WPM and let camera action carry visual detail without VO repeating it.

    '
  deliverable: cpl_ycd_ep01_av_script.md
  spokes:
  - writers-room
  - story-lane
  public_checks:
    max_words: 1600
    min_words: 60
    required_sections:
    - Audio
    - Video
    - Timing
    min_form_score: 0.65
  blind_holdouts:
    require_official_cpl_mandate: true
    forbid_terms_as_mandates:
    - Grow
    - Books & Reading
    - Community
    forbid_unverified_claims:
    - approved for release
    - Asana updated
    failure_category: cpl_mandate_or_authority_violation
  use_cases:
  - id: 30s-vhs-digitization
    intent: 30-second timed A/V script for PITCH-YCD Episode 1 (free VHS digitization). Spoken cadence <=150 WPM; picture carries detail the VO does not repeat.
    target_audience: Director, Host, and Editor
    skills:
    - spoken-ear writing
    - audio-visual counterpoint
    - timecode math
    tools:
    - Knowledge/Media Agency/Skills and Workflows/media-writing.md (MW-04)
  - id: 15s-social-cutdown
    intent: '15-second vertical cutdown of the same episode for Instagram Reels: hook in 2 seconds, captions-first, no reliance on audio.'
    target_audience: Digital Marketing & Editor
    skills:
    - platform-native hook writing
    - muted-first design
    - cut-to-time
    tools:
    - Knowledge/Media Agency/Skills and Workflows/channel-and-content-operations.md (CH-06)
  - id: host-intro-live-read
    intent: '45-second spoken host introduction to be read live on camera without a teleprompter: short breath-length sentences, one idea each.'
    target_audience: On-camera Host
    skills:
    - speaking-script cadence
    - breath-length sentences
    - memorability
    tools:
    - Knowledge/Media Agency/Skills and Workflows/media-writing.md (MW-06)
  - id: 1m-branch-walkthrough
    intent: '1-minute (01:00) timed A/V script table (`MM:SS-MM:SS | Audio | Video`) walking a first-time patron through booking and using a CPL Technology or Spaces resource (e.g., Central Library recording studio or VHS station). Spoken cadence <=150 WPM, visual-audio counterpoint, and clear immediate patron action.'
    target_audience: Director, Host, Camera Operator, and Editor
    skills:
    - spoken-ear writing
    - audio-visual counterpoint
    - 1-minute pacing and beat structure
    tools:
    - Knowledge/Media Agency/Skills and Workflows/media-writing.md (MW-04)
    - story-lane
  - id: 3m-patron-story-mini-doc
    intent: '3-minute (03:00) timed A/V script table (`MM:SS-MM:SS | Audio | Video`) for a patron-centered CPL mini-documentary under official 2027-2030 Experiences and Expertise mandates: 3-act arc, B-roll/interview counterpoint, spoken cadence <=150 WPM, explicit audio/location clearance holds, and caption/muted check.'
    target_audience: Director, Producer, Host, and Editor
    skills:
    - 3-act documentary pacing
    - interview-and-broll counterpoint
    - spoken-ear cadence and breathing room
    - clearance-hold custody
    tools:
    - Knowledge/Media Agency/Skills and Workflows/media-writing.md (MW-04)
    - Knowledge/Media Agency/Skills and Workflows/media-writing.md (MW-02)
    - story-lane
  - id: 5m-deep-dive-episode
    intent: '5-minute (05:00) full YouTube episode A/V script table (`MM:SS-MM:SS | Audio | Video`) for PITCH-YCD or PITCH-NQ aligned with official 2027-2030 CPL mandates: cold open hook, 3-4 chapters with retention resets every 60-90 seconds, visual-first storytelling at <=150 WPM, B-roll/lower-third cues, caption/muted readiness, and explicit owner holds for unverified facts or clearances.'
    target_audience: Series Producer, Director, Host, and Senior Editor
    skills:
    - long-form YouTube retention architecture
    - chapter-beat pacing
    - visual-first subtraction
    - spoken-ear cadence at scale
    - claim-and-clearance custody
    tools:
    - Knowledge/Media Agency/Skills and Workflows/media-writing.md (MW-04)
    - Knowledge/Media Agency/Skills and Workflows/media-writing.md (MW-02)
    - story-lane
    - writers-room
