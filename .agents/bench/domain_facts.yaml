# Upstream Verified Domain Fact Packs (Injected BEFORE Generation Begins)
# Prevents service-desk-breaking factual hallucinations and unverified competitor claims at the root.
version: "1.0"

topics:
  vhs_digitization:
    match_keywords: [vhs, digitization, tape, transfer, cassette]
    verified_facts:
      - "VHS cassettes store video on magnetic oxide tape that degrades over time (NEVER call it 'magnetic ink')."
      - "VHS digitization transfers in 1:1 real time—a 60-minute tape takes 60 minutes to capture (NEVER claim 'saved in minutes')."
      - "The Central Library Digital Media Lab station is free to use with a Calgary Public Library card."
      - "The station is self-directed: staff orient patrons on setup and step back so patrons control their own memories (do not overcommit live technical repair without Service Owner CD-01 sign-off)."
      - "Patrons bring their own VHS tape and USB drive; exact current booking lead times and deck rules are held for Service Owner (CD-01) confirmation."
    forbidden_myths_and_jabs:
      - "magnetic ink"
      - "saved in minutes"
      - "invented competitor dollar prices (e.g. $30-per-tape mail-in quotes)"
      - "brochure legalese (e.g. 'full custody of every reel')"

  reader_advisory:
    match_keywords: [reader, advisory, next question, reading list, book]
    verified_facts:
      - "Reader advisory is a free specialist service with a Calgary Public Library card under official 2027-2030 Collections and Expertise mandates."
      - "Focus on giving patrons a concrete method to choose their next read, not generic book-club clichés."
    forbidden_myths_and_jabs:
      - "Vision 2040 ('three in four Calgarians') as a single-video KPI"
      - "unverified circulation lift percentages"
