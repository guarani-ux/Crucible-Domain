schema: hourly-task-system/v1
beat_id: BEAT-06
scheduled_time_local: "07:30 America/Edmonton"
title: Independent Read-Only Audit & 08:00 AM Executive Morning Brief
depends_on_previous_beat: BEAT-05

objective: >
  Commission an independent fresh read-only review of everything built overnight, re-run all
  deterministic tests and CLI checks in a clean process, verify zero privacy/attribution leaks
  and zero ideas outrunning implementation, and write the 60-second 08:00 AM Morning Brief.

inputs_to_read:
  - run_state.yaml
  - cpl_handoff_portable.yaml
  - 01_convergence_architecture.yaml
  - 02_platform_intelligence.yaml
  - 03_craft_and_niche_playbook.yaml
  - mvp_cli.py
  - test_mvp.py
  - content_calendar.md
  - framework_b_phase2_draft.md

verification_protocol:
  - Dispatch independent read-only subagent (research) to audit all overnight_mvp/ files against:
      (1) never_infer and attribution guardrails,
      (2) privacy boundary (0 coworker names, 0 Asana URLs in synced directory),
      (3) real web URLs backing demographic/filmmaking/peer claims,
      (4) alignment between YAML specs, mvp_cli.py code, and generated content_calendar.md.
  - Re-execute python -m unittest discover -s "Project/Inner Gravity/overnight_mvp" -v (fresh process).
  - Re-execute mvp_cli.py build-calendar and verify reproducible output.
  - Fix any defect surfaced by the independent reviewer before closing out at 08:00 AM.

deliverables_to_build:
  - AUDIT_RECEIPT_2026-11-22.md   # Independent review findings + raw test exit codes + file SHA-256 table
  - MORNING_BRIEF_2026-11-22.md   # 60-second executive summary for 08:00 AM pickup

deterministic_done_gate:
  checks:
    - Independent audit complete with zero unresolved critical defects
    - Unit tests pass 6/6 (exit 0) after final edit
    - Privacy scan confirms 0 leaks
    - run_state.yaml updated with BEAT-06 status=PASSED and overall_status=COMPLETED_BY_0800

hard_boundaries:
  asana: read_only
  external_mutations: forbidden
  do_not_claim_live_colleague_acceptance: true
