  - ../../../README.md
  - ../../Work Operating System/Work_Operating_System_Work_Levels_and_Forks.md
  - ../../../Knowledge/Media Agency/Skills and Workflows/channel-and-content-operations.md
  - ../../../Knowledge/Media Agency/Skills and Workflows/institutional-evidence.md
  - ../system_blueprint_v2.yaml

research_and_design_questions:
  - How do Engine 1 (Strategic/Gap Intelligence), Engine 2 (Modular Creative & Production Economy),
    and Engine 3 (Custody & 6-Gate Handoff Spine) converge inside one single Task-as-a-System YAML unit?
  - How does the Content & Release Calendar emerge automatically from Task-as-a-System packets
    rather than becoming a second manual tracker that drifts?
  - Which exact fields from CH-01..CH-06, WOS forks, and G01..G06 are load-bearing vs. ceremony to cut?

deliverables_to_build:
